# Bu dosyadaki ayarlamalar, paket icerisindeki varsayilan application.properties dosyasini ezer.
# Runtime sirasinda aktif olarak kullanilir.

# Ornek: Log dizinini veya ismini degistirmek isterseniz:
# quarkus.log.file.path=/var/log/sign-server.log

# Ornek: API anahtarlarini degistirmek isterseniz:
# signserver.application.api-keys=YENI_API_KEY

# CORS (Gentegre AI e-imza, 13.11.2026): tarayici web uygulamasindan (istemci kipi) dogrudan cagirir.
#   Koken listesi: yerel gelistirme + sunucu adresleri. Yeni kurulum eklenince buraya eklenir, servis yeniden baslatilir.
quarkus.http.cors.enabled=true
quarkus.http.cors=true
quarkus.http.cors.origins=/https?:\/\/(localhost|127\.0\.0\.1)(:[0-9]+)?/,https://gentegreai.com,https://www.gentegreai.com,https://feta.gentegreai.com,http://46.36.201.170,https://46.36.201.170,http://90.158.5.227
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=X-Api-Key,Content-Type,Accept
quarkus.http.cors.access-control-max-age=24H
