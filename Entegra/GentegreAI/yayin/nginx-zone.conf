    # ------------------------------------------------------------ /zone ----
    # ZONE: Delphi'den web'e kalici gecis (25.10.2026, ayri musteri). API'de basic auth kapali
    # (oturum JWT ile); web blogu sunucunun genel basic auth kuralini izler.
    location ^~ /zone/api/ {
        auth_basic off;
        proxy_pass         http://127.0.0.1:5184/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        proxy_read_timeout   300s;
    }

    # GÜVENLİK BAŞLIKLARI (kod inceleme 30.10.2026 K48).
    location ^~ /zone/ {
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        alias /home/gentegre/gentegre-zone/web/;
        try_files $uri $uri/ /zone/index.html;
    }
    location = /zone { return 301 /zone/; }
