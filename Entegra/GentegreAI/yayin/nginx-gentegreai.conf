# ============================================================================
#  gentegreai.com - ORTAK GİRİŞ PANELİ + MÜŞTERİ ALT ALAN ADLARI (1190, kararlar 26.10.2026)
#  /etc/nginx/sites-available/gentegreai  (yayin/panel-hazirla.sh kurar). HTTPS: DNS Cloudflare'de (turuncu bulut),
#  Cloudflare Origin sertifikası (gentegreai.com + *.gentegreai.com, 15 yıl) 443'te - panel-hazirla.sh cloudflare.
#
#  · gentegreai.com (www, panel. -> buraya) tek statik sayfa (~/gentegre-panel/index.html); /f/<kod>/api/kimlik/giris-kodu
#                                   yalnız KAYITLI firma kodunu ilgili API'ye iletir; bilinmeyen kod "hatalı"
#                                   ile aynı 401'i alır (firma listesi dışarı sızmaz). Deneme sınırı 10/dk + 5.
#  · <kod>.gentegreai.com           firmanın kendi ekranı: / -> /<kod>/ ; web ~/gentegre-<kod>/web, API 127.0.0.1:<port>.
#                                   Basic auth YOK (müşteri girişi). Başka firmanın yolu (/medx/ @ zone.) 404.
#  Firma ekleme / askıya alma: aşağıdaki map'e satır (port = yayinla.ps1 kurulum portu) + nginx reload.
#  IP adresindeki eski /zone/, /medx/ ... blokları (gentegre-mockup) DEĞİŞMEDİ.
# ============================================================================

map $gentegre_kod $gentegre_port {
    default "";
    feta    5183;
    zone    5184;
    medx    5185;
}

limit_req_zone $binary_remote_addr zone=gentegre_panel:10m rate=10r/m;

# CLOUDFLARE ARKASINDA GERÇEK İSTEMCİ IP'Sİ (26.10.2026): istek Cloudflare'den gelince adres CF-Connecting-IP'den
#   alınır - yoksa deneme sınırı ve API günlükleri herkesi Cloudflare sunucusu sayar. Yalnız bu aralıklardan
#   gelen başlığa güvenilir (https://www.cloudflare.com/ips/).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# --------------------------------------------------- kök alan adı / www ----
# PANEL KÖK ALAN ADINDA (kullanıcı 26.10.2026: "direkt gentegreai.com da açılır yapamaz mısın"): giriş sayfası
#   gentegreai.com'un kendisi; www ve panel. oraya kalıcı yönlenir.
server {
    listen 80;
    include /etc/nginx/gentegreai-ssl*.conf;   # Cloudflare Origin sertifikası (panel-hazirla.sh cloudflare) - yoksa yalnız 80
    server_name www.gentegreai.com panel.gentegreai.com;
    server_tokens off;
    return 301 $scheme://gentegreai.com$request_uri;
}

# ------------------------------------------------------------------ panel ----
server {
    listen 80;
    include /etc/nginx/gentegreai-ssl*.conf;   # Cloudflare Origin sertifikası (panel-hazirla.sh cloudflare) - yoksa yalnız 80
    server_name gentegreai.com;
    root /home/gentegre/gentegre-panel;
    server_tokens off;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    location ~ ^/f/(?<gentegre_kod>[a-z0-9-]+)/api/kimlik/giris-kodu$ {
        limit_req zone=gentegre_panel burst=5 nodelay;
        limit_req_status 429;
        default_type application/json;
        if ($gentegre_port = "") {
            return 401 '{"hata":{"kod":"YETKISIZ","mesaj":"Kullanici adi ya da parola hatali."}}';
        }
        proxy_pass         http://127.0.0.1:$gentegre_port/api/kimlik/giris-kodu;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 16k;
    }

    location / { return 404; }
}

# ------------------------------------------------------- firma alt alanı ----
server {
    listen 80;
    include /etc/nginx/gentegreai-ssl*.conf;   # Cloudflare Origin sertifikası (panel-hazirla.sh cloudflare) - yoksa yalnız 80
    server_name ~^(?<gentegre_kod>[a-z0-9-]+)\.gentegreai\.com$;
    server_tokens off;

    if ($gentegre_port = "") { return 404; }

    location = / { return 302 /$gentegre_kod/$is_args$args; }

    location ~ ^/(?<yol_kod>[a-z0-9-]+)/api/(?<api_yol>.*)$ {
        if ($yol_kod != $gentegre_kod) { return 404; }
        proxy_pass         http://127.0.0.1:$gentegre_port/api/$api_yol$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        proxy_read_timeout   300s;
    }

    location ~ ^/(?<yol_kod>[a-z0-9-]+)/ {
        if ($yol_kod != $gentegre_kod) { return 404; }
        root /home/gentegre/gentegre-$gentegre_kod/web;
        rewrite ^/[a-z0-9-]+/(.*)$ /$1 break;
        # Yoksa SPA giriş sayfası - /<kod>/index.html'e (bu blok) iç yönlendirme; "/index.html" genel 404 bloğuna düşüyordu.
        try_files $uri /$gentegre_kod/index.html;
    }

    location / { return 404; }
}
