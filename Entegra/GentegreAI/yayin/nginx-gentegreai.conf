# ============================================================================
#  gentegreai.com - ORTAK GİRİŞ PANELİ + MÜŞTERİ ALT ALAN ADLARI (1190, kararlar 26.10.2026)
#  /etc/nginx/sites-available/gentegreai  (yayin/panel-hazirla.sh kurar; HTTPS'i certbot ekler)
#
#  · panel.gentegreai.com           tek statik sayfa (~/gentegre-panel/index.html); /f/<kod>/api/kimlik/giris-kodu
#                                   yalnız KAYITLI firma kodunu ilgili API'ye iletir; bilinmeyen kod "hatalı"
#                                   ile aynı 401'i alır (firma listesi dışarı sızmaz). Deneme sınırı 10/dk + 5.
#  · <kod>.gentegreai.com           firmanın kendi ekranı: / -> /<kod>/ ; web ~/gentegre-<kod>/web, API 127.0.0.1:<port>.
#                                   Basic auth YOK (müşteri girişi). Başka firmanın yolu (/medx/ @ zone.) 404.
#  Firma ekleme / askıya alma: aşağıdaki map'e satır (port = yayinla.ps1 kurulum portu) + nginx reload.
#  IP adresindeki eski /zone/, /medx/ ... blokları (gentegre-mockup) DEĞİŞMEDİ.
# ============================================================================

map $gentegre_kod $gentegre_port {
    default "";
    feta    5183;
    zone    5184;
    medx    5185;
}

limit_req_zone $binary_remote_addr zone=gentegre_panel:10m rate=10r/m;

# ------------------------------------------------------------------ panel ----
server {
    listen 80;
    server_name panel.gentegreai.com;
    root /home/gentegre/gentegre-panel;
    server_tokens off;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    location ~ ^/f/(?<gentegre_kod>[a-z0-9-]+)/api/kimlik/giris-kodu$ {
        limit_req zone=gentegre_panel burst=5 nodelay;
        limit_req_status 429;
        default_type application/json;
        if ($gentegre_port = "") {
            return 401 '{"hata":{"kod":"YETKISIZ","mesaj":"Kullanici adi ya da parola hatali."}}';
        }
        proxy_pass         http://127.0.0.1:$gentegre_port/api/kimlik/giris-kodu;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 16k;
    }

    location / { return 404; }
}

# ------------------------------------------------------- firma alt alanı ----
server {
    listen 80;
    server_name ~^(?<gentegre_kod>[a-z0-9-]+)\.gentegreai\.com$;
    server_tokens off;

    if ($gentegre_port = "") { return 404; }

    location = / { return 302 /$gentegre_kod/$is_args$args; }

    location ~ ^/(?<yol_kod>[a-z0-9-]+)/api/(?<api_yol>.*)$ {
        if ($yol_kod != $gentegre_kod) { return 404; }
        proxy_pass         http://127.0.0.1:$gentegre_port/api/$api_yol$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        proxy_read_timeout   300s;
    }

    location ~ ^/(?<yol_kod>[a-z0-9-]+)/ {
        if ($yol_kod != $gentegre_kod) { return 404; }
        root /home/gentegre/gentegre-$gentegre_kod/web;
        rewrite ^/[a-z0-9-]+/(.*)$ /$1 break;
        try_files $uri /index.html;
    }

    location / { return 404; }
}
