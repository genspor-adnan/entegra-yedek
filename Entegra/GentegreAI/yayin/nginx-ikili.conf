# ============================================================================
#  GentegreAI — IKI KURULUM nginx bloklari
#
#     /genotipai/   -> HBYS  (db gentegre_ai,  api 127.0.0.1:5180)
#     /gentegreai/  -> ERP   (db gentegre_erp, api 127.0.0.1:5181)
#     /ai/          -> eski adres; /genotipai/ya yonlendirilir (kirik link
#                      birakmamak icin; kaydedilmis yer imleri calismaya devam
#                      eder)
#
#  Bu parca mevcut server{} blogunun ICINE, kapanis parantezinden once girer.
#  Uygulamak icin: bash nginx-ikili-uygula.sh (sudo ile).
#
#  ^~ SART: bu server blogunda uzanti-regex location'i var (js|css|svg...) ve
#  nginx'te regex, prefix'ten ONCE eslesir - /genotipai/assets/*.js oraya dusup
#  mockup kokunde aranir, 404 verirdi. ^~ ile prefix eslesince regex denenmez.
# ============================================================================

    # ------------------------------------------------------- /genotipai ----
    # API: tarayici /genotipai/api/... cagirir, docker'daki servise /api/... gider.
    location ^~ /genotipai/api/ {
        auth_basic off;  # API: JWT ile korunuyor
        proxy_pass         http://127.0.0.1:5180/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        proxy_read_timeout   120s;
    }

    # Statik dosyalar + SPA: bilinmeyen yol index.html'e duser (router karsilar).
    location ^~ /genotipai/ {
        alias /home/gentegre/gentegre-ai/web/;
        try_files $uri $uri/ /genotipai/index.html;
    }
    location = /genotipai { return 301 /genotipai/; }

    # ------------------------------------------------------ /gentegreai ----
    location ^~ /gentegreai/api/ {
        auth_basic off;
        proxy_pass         http://127.0.0.1:5181/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        proxy_read_timeout   120s;
    }

    location ^~ /gentegreai/ {
        alias /home/gentegre/gentegre-erp/web/;
        try_files $uri $uri/ /gentegreai/index.html;
    }
    location = /gentegreai { return 301 /gentegreai/; }
