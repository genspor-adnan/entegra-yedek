    # ------------------------------------------- /gentegreai/delphi (pilot) ----
    # Delphi aktarımı pilotu (dokuman/19). /gentegreai/ bloğundan UZUN önek - önce eşleşir.
    # API'de basic auth KAPALI: aktarım ajanı X-Aktarim-Anahtar ile gelir.
    location ^~ /gentegreai/delphi/api/ {
        auth_basic off;
        proxy_pass         http://127.0.0.1:5182/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        proxy_read_timeout   300s;
    }

    location ^~ /gentegreai/delphi/ {
        alias /home/gentegre/gentegre-erp-delphi/web/;
        try_files $uri $uri/ /gentegreai/delphi/index.html;
    }
    location = /gentegreai/delphi { return 301 /gentegreai/delphi/; }
