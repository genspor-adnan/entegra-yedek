# ============================================================================
#  SONOMED - tek musterilik sunucu (90.158.5.227), KOK YOLDA (13.11.2026).
#  sunucu-kur.sh __KOK__ / __PORT__ yerlerini doldurup sites-available/sonomed'e yazar.
#  IP uzerinden HTTP (kullanici: "IP uzerinden", "simdilik basit olsun"); alan adi + TLS gelince
#  nginx-tls-uygula.sh deseniyle 443 eklenir. Basic auth YOK (musteri girisi; oturum JWT).
# ============================================================================
# KIMLIK UCLARI (kod inceleme 30.10.2026 K30): giris / yenile / parola uclari IP basina 30/dk.
limit_req_zone $binary_remote_addr zone=sonomed_kimlik:10m rate=30r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # API: docker konteyneri yalniz 127.0.0.1:__PORT__ dinler.
    location ^~ /api/kimlik/ {
        limit_req zone=sonomed_kimlik burst=10 nodelay;
        proxy_pass         http://127.0.0.1:__PORT__/api/kimlik/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location ^~ /api/ {
        proxy_pass         http://127.0.0.1:__PORT__/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        proxy_read_timeout   300s;
    }

    # Web (vite derlemesi, VITE_BASE=/): yayinla.ps1 -> sunucu-guncelle.sh __KOK__/web'e koyar.
    location / {
        root __KOK__/web;
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    location = /index.html {
        root __KOK__/web;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
