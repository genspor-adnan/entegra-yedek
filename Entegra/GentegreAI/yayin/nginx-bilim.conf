    # ------------------------------------------------------------ /bilim ----
    # BILIM (24.10.2026): eski Delphi aktarimi pilotu (/gentegreai/delphi/) yeni adi.
    # API'de basic auth KAPALI: oturum JWT ile, aktarim ajani X-Aktarim-Anahtar ile gelir.
    location ^~ /bilim/api/ {
        auth_basic off;
        proxy_pass         http://127.0.0.1:5182/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        proxy_read_timeout   300s;
    }

    # GÜVENLİK BAŞLIKLARI (kod inceleme 30.10.2026 K48).
    location ^~ /bilim/ {
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        alias /home/gentegre/gentegre-bilim/web/;
        try_files $uri $uri/ /bilim/index.html;
    }
    location = /bilim { return 301 /bilim/; }
