    # ------------------------------------------------------------ /medx ----
    # MEDX: Delphi'den web'e kalici gecis (25.10.2026, ayri musteri). API'de basic auth kapali
    # (oturum JWT ile); web blogu sunucunun genel basic auth kuralini izler.
    location ^~ /medx/api/ {
        auth_basic off;
        proxy_pass         http://127.0.0.1:5185/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        proxy_read_timeout   300s;
    }

    location ^~ /medx/ {
        alias /home/gentegre/gentegre-medx/web/;
        try_files $uri $uri/ /medx/index.html;
    }
    location = /medx { return 301 /medx/; }
