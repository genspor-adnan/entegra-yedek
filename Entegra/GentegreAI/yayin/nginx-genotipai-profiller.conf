# GentegreAI /genotipai PROFILLERI (izole ayri-DB/konteyner). sudo: nginx-genotipai-uygula.sh
    location = /genotipai/ {
        alias /home/gentegre/genotipai-landing/index.html;
        default_type text/html;
    }
    location = /genotipai { return 301 /genotipai/; }

    # -------- /genotipai/hastane (Hastane) -> db gentegre_ai_hastane, api 5190
    location ^~ /genotipai/hastane/api/ {
        auth_basic off;
        proxy_pass         http://127.0.0.1:5190/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        proxy_read_timeout   120s;
    }
    location ^~ /genotipai/hastane/ {
        alias /home/gentegre/gentegre-ai-hastane/web/;
        try_files $uri $uri/ /genotipai/hastane/index.html;
    }
    location = /genotipai/hastane { return 301 /genotipai/hastane/; }
